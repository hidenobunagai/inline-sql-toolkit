name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: inline-sql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.8"
  UV_VERSION: "0.9.28"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci:quality

  grammar-gate:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.95.0", stable]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:grammar
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  integration:
    needs: grammar-gate
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: ["1.95.0", stable]
        trust: [trusted, untrusted]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run integration tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bun run "test:integration:${{ matrix.trust }}"
          else
            bun run "test:integration:${{ matrix.trust }}"
          fi
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  package:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: mkdir -p dist-vsix reports package-artifact
      - run: bun run package:vsix
      - name: Verify VSIX inventory and provenance
        run: |
          uv run python tools/verify_vsix.py \
            dist-vsix/inline-sql-toolkit-0.1.1.vsix \
            --report reports/vsix-components.osv.json
          sha256sum dist-vsix/inline-sql-toolkit-0.1.1.vsix > reports/inline-sql-toolkit.vsix.sha256
          unzip -Z1 dist-vsix/inline-sql-toolkit-0.1.1.vsix > reports/vsix-inventory.txt
          cp tools/sqlparse-vendor.requirements.txt reports/sqlparse-vendor.requirements.txt
          cp tools/sqlparse-vendor.lock reports/sqlparse-vendor.lock
          cp third_party/sqlparse/files.sha256 reports/sqlparse-files.sha256
          cp THIRD_PARTY_NOTICES.md reports/THIRD_PARTY_NOTICES.md
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "20"
      - run: node --check dist/extension.js
      - run: cp dist-vsix/inline-sql-toolkit-0.1.1.vsix package-artifact/
      - run: cp reports/inline-sql-toolkit.vsix.sha256 reports/vsix-inventory.txt reports/sqlparse-vendor.requirements.txt reports/sqlparse-vendor.lock reports/sqlparse-files.sha256 reports/THIRD_PARTY_NOTICES.md package-artifact/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: packaged-vsix
          path: package-artifact
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vsix-osv-input
          path: reports/vsix-components.osv.json

  vsix-install-smoke:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: packaged-vsix
          path: package-artifact
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun tools/install_and_smoke_vsix.ts package-artifact/inline-sql-toolkit-0.1.0.vsix

  osv-packaged-components:
    needs: package
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      download-artifact: vsix-osv-input
      scan-args: --lockfile=osv-scanner:vsix-components.osv.json
      upload-sarif: true
