name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: inline-sql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.8"
  UV_VERSION: "0.9.28"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
          cache: bun
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci:quality

  python-test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest test/python -q
      - run: uv run python tools/verify_vendor.py --lock-projection-only
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  grammar-gate:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.95.0", stable]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
          cache: bun
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: uv sync --frozen
      - run: bun run test:grammar
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  integration:
    needs: [python-test, grammar-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: ["1.95.0", stable]
        trust: [trusted, untrusted]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
          cache: bun
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: uv sync --frozen
      - name: Run integration tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bun run "test:integration:${{ matrix.trust }}"
          else
            bun run "test:integration:${{ matrix.trust }}"
          fi
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  performance:
    needs: python-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Benchmark packaged helper
        run: |
          mkdir -p reports
          uv run python tools/benchmark_helper.py \
            --python python3 \
            --iterations 7 \
            --document-bytes 102400 \
            --hard-timeout-seconds 5 \
            --output reports/performance.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("reports/performance.json").read_text())
          median = float(report["median_seconds"])
          print(f"Performance median: {median:.6f}s (target <= 1.0s; hard limit 5.0s)")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with Path(summary_path).open("a", encoding="utf-8") as summary:
                  summary.write(f"### Inline SQL helper performance\\n\\n- median: `{median:.6f}s`\\n- minimum: `{float(report['minimum_seconds']):.6f}s`\\n- maximum: `{float(report['maximum_seconds']):.6f}s`\\n- target (1s): `{bool(report['regression_target_met'])}`\\n")
          if median > 5.0:
              raise SystemExit("benchmark exceeded five-second hard limit")
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: performance-report
          path: reports/performance.json

  package:
    needs: [integration, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
          cache: bun
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: uv sync --frozen
      - run: mkdir -p dist-vsix reports package-artifact
      - run: bun run package:vsix
      - name: Verify VSIX inventory and provenance
        run: |
          uv run python tools/verify_vsix.py \
            dist-vsix/inline-sql-toolkit-0.1.0.vsix \
            --report reports/vsix-components.osv.json
          sha256sum dist-vsix/inline-sql-toolkit-0.1.0.vsix > reports/inline-sql-toolkit.vsix.sha256
          unzip -Z1 dist-vsix/inline-sql-toolkit-0.1.0.vsix > reports/vsix-inventory.txt
          cp tools/sqlparse-vendor.requirements.txt reports/sqlparse-vendor.requirements.txt
          cp tools/sqlparse-vendor.lock reports/sqlparse-vendor.lock
          cp third_party/sqlparse/files.sha256 reports/sqlparse-files.sha256
          cp THIRD_PARTY_NOTICES.md reports/THIRD_PARTY_NOTICES.md
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "20"
      - run: node --check dist/extension.js
      - run: cp dist-vsix/inline-sql-toolkit-0.1.0.vsix package-artifact/
      - run: cp reports/inline-sql-toolkit.vsix.sha256 reports/vsix-inventory.txt reports/sqlparse-vendor.requirements.txt reports/sqlparse-vendor.lock reports/sqlparse-files.sha256 reports/THIRD_PARTY_NOTICES.md package-artifact/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: packaged-vsix
          path: package-artifact
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vsix-osv-input
          path: reports/vsix-components.osv.json

  vsix-install-smoke:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: packaged-vsix
          path: package-artifact
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun tools/install_and_smoke_vsix.ts package-artifact/inline-sql-toolkit-0.1.0.vsix

  offline-smoke:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: packaged-vsix
          path: package-artifact
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Pull pinned offline image
        run: docker pull python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
      - name: Inspect pinned image digest
        run: docker image inspect python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de --format '{{json .RepoDigests}}' | tee image-repodigests.json
      - name: Run offline Docker smoke
        run: uv run python tools/offline_vsix_smoke.py --vsix package-artifact/inline-sql-toolkit-0.1.0.vsix --request test/fixtures/helper/offline-request.json --image python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de

  osv-packaged-components:
    needs: package
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      download-artifact: vsix-osv-input
      scan-args: --lockfile=osv-scanner:vsix-components.osv.json
      upload-sarif: true
