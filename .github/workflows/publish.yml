name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run package:vsix
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath dist-vsix/*.vsix -p "$VSCE_PAT" --skip-duplicate
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # Open VSX answers 503 intermittently (three times on 2026-09-17 across two
        # repositories) and can even fail the request after accepting the upload.
        # --skip-duplicate makes the retry harmless in that case: an
        # already-published version reports success.
        run: |
          for attempt in 1 2 3 4; do
            if npx --yes ovsx publish dist-vsix/*.vsix -p "$OVSX_PAT" --skip-duplicate; then
              exit 0
            fi
            echo "::warning::ovsx publish attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::ovsx publish failed after 4 attempts"
          exit 1

  npm:
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC) only — no NPM_TOKEN secret, nothing to rotate or
    # expire, and provenance attestations are attached automatically. An
    # accidental token secret must not be able to take over this job, so there is
    # deliberately no token path here; the one-time bootstrap for a brand-new
    # package (npm cannot be given a trusted publisher before the package exists)
    # is documented in docs/releasing.md.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      # dist/package.json must ship as well: it marks dist/ as CommonJS, and the
      # root package.json is "type": "module". 0.4.7 was published without it and
      # the CLI could not start ("module is not defined in ES module scope").
      - name: Verify the npm tarball ships the CLI
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          grep -q "dist/cli.js" /tmp/npm-pack.txt
          grep -q "dist/package.json" /tmp/npm-pack.txt
      # Idempotent on purpose: re-running the workflow (for example to retry the
      # marketplaces after an Open VSX 503) must not fail just because npm already
      # has this version.
      - name: Check whether this version is already on npm
        id: npm-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "inline-sql-toolkit@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >>"$GITHUB_OUTPUT"
            echo "inline-sql-toolkit@${VERSION} is already published"
          else
            echo "published=false" >>"$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential when a trusted publisher matches this workflow, and adds
      # provenance attestations automatically.
      - name: Publish to npm (trusted publishing)
        if: steps.npm-version.outputs.published == 'false'
        run: npm publish --access public
