repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bun run format:check
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bun run lint
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
